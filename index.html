  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Animación de giro 3D intenso de balotas */
    .lottery-ball-card {
      perspective: 1200px;
      animation: superSpinEnter 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      opacity: 0;
      will-change: transform, opacity;
    }

    @keyframes superSpinEnter {
      0% {
        opacity: 0;
        /* GIRO INTENSO: 3 a 4 vueltas completas en X, Y y Z */
        transform: translate(var(--tx), var(--ty)) scale(0.05) rotate(1440deg) rotateX(1080deg) rotateY(720deg);
        filter: blur(12px);
      }
      70% {
        opacity: 1;
        transform: translate(0, 0) scale(1.12) rotate(-20deg) rotateX(15deg);
        filter: blur(0px);
      }
      85% {
        transform: scale(0.95) rotate(10deg);
      }
      100% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg) rotateX(0deg) rotateY(0deg);
      }
    }

    /* Animación continua del bombo de balotas */
    @keyframes tumble {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .animate-tumble {
      animation: tumble 1.2s infinite ease-in-out;
    }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #232d42;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }
  </style>

    function renderLotteryPairs() {

        const angle = Math.random() * Math.PI * 2;
        const distance = 800 + Math.random() * 500; // Sale proyectado desde más lejos

        card.style.setProperty('--tx', tx);
        card.style.setProperty('--ty', ty);
        card.style.animationDelay = delay;

        card.innerHTML = `
          <div class="flex items-center justify-between gap-2 mb-4 pb-4 border-b border-darkBorder">
            <span class="text-xs font-black uppercase tracking-widest text-purple-400 bg-purple-500/10 px-3 py-1 rounded-full border border-purple-500/20">
              Pareja #${idx + 1}
            </span>
            <button onclick="toggleSinglePair(${idx})" class="p-2 hover:bg-darkBorder rounded-xl text-slate-400 hover:text-white transition-colors">
              ${isVisible ? '👁️' : '🙈'}
            </button>
          </div>

          <div class="grid grid-cols-11 items-center gap-2 my-2">
            <!-- Quien regala -->
            <div class="col-span-5 text-center flex flex-col items-center">
              <img src="${giverChar.avatar}" class="w-16 h-16 rounded-2xl bg-darkBg border-2 border-purple-500/50 p-1 mb-2 shadow-lg">
              <span class="text-xs text-slate-400 font-bold uppercase">Le regala</span>
              <span class="text-base font-extrabold text-white truncate max-w-full">${pair.giver}</span>
            </div>

            <!-- Flecha conector -->
            <div class="col-span-1 text-center font-black text-purple-400 text-xl animate-pulse">
              ➔
            </div>

            <!-- Receptor -->
            <div class="col-span-5 text-center flex flex-col items-center">
              <div class="relative w-16 h-16 mb-2">
                <img src="${receiverChar.avatar}" class="w-16 h-16 rounded-2xl bg-darkBg border-2 border-cyan-500/50 p-1 shadow-lg transition-all duration-300 ${!isVisible ? 'filter blur-md grayscale' : ''}">
                ${!isVisible ? `<div class="absolute inset-0 flex items-center justify-center bg-darkBg/80 rounded-2xl text-xl">❓</div>` : ''}
              </div>
              <span class="text-xs text-slate-400 font-bold uppercase">Recibe regalo</span>
              <span class="text-base font-extrabold text-cyan-300 truncate max-w-full">
                ${isVisible ? pair.receiver : '••••••••••'}
              </span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function triggerLotteryAnimation() {
      const tombola = document.getElementById("tombola-icon");
      tombola.classList.add("animate-tumble");
      
      // Volver a renderizar disparando nuevamente las animaciones de giros 3D
      renderLotteryPairs();

      setTimeout(() => {
        tombola.classList.remove("animate-tumble");
      }, 1500);
    }

    function toggleSinglePair(idx) {
      pairVisibility[idx] = !pairVisibility[idx];
      renderLotteryPairs();
    }

    function toggleAllPairs(show) {
      officialPairs.forEach((_, idx) => pairVisibility[idx] = show);
      renderLotteryPairs();
    }

    function switchTab(tab) {
      const charTab = document.getElementById("tab-characters");
      const drawTab = document.getElementById("tab-draw");
      const charBtn = document.getElementById("tab-characters-btn");
      const drawBtn = document.getElementById("tab-draw-btn");

      const activeClasses = ["bg-gradient-to-r", "from-purple-600", "to-indigo-600", "text-white", "shadow-lg", "shadow-purple-600/30"];
      const inactiveClasses = ["text-slate-400", "hover:text-slate-200", "hover:bg-white/5"];

      if (tab === "characters") {
        charTab.classList.remove("hidden");
        drawTab.classList.add("hidden");

        charBtn.classList.add(...activeClasses);
        charBtn.classList.remove(...inactiveClasses);

        drawBtn.classList.remove(...activeClasses);
        drawBtn.classList.add(...inactiveClasses);
      } else {
        charTab.classList.add("hidden");
        drawTab.classList.remove("hidden");

        drawBtn.classList.add(...activeClasses);
        drawBtn.classList.remove(...inactiveClasses);

        charBtn.classList.remove(...activeClasses);
        charBtn.classList.add(...inactiveClasses);

        triggerLotteryAnimation();
      }
    }
  </script>
</body>
</html>
